[project]
name = "veriledger-api"
version = "0.1.0"
description = "Verifiable Finance Backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.2",
    "asyncpg>=0.29.0",
    "fastapi>=0.111.1",
    "pydantic-settings>=2.4.0",
    "pydantic[email]>=2.8.2",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.31",
    "structlog>=24.4.0",
    "uvicorn[standard]>=0.30.3",
    "PyJWT>=2.8.0",
    "bcrypt>=4.0.0",
    "cryptography>=49.0.0",
    "aiosqlite>=0.22.1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.11.1",
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
    "ruff>=0.5.6",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # do not perform function calls in argument defaults (FastAPI uses this heavily)
]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["alembic"]

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true
