name: CI

on:
  # Every PR, whatever its base, so a stacked PR is checked too
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or PR cancels the run it makes obsolete
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: veriledger
          POSTGRES_PASSWORD: veriledger
          POSTGRES_DB: veriledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veriledger -d veriledger_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The settings need a URL at import; tests that touch a database use TEST_DATABASE_URL
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      TEST_DATABASE_URL: postgresql+asyncpg://veriledger:veriledger@localhost:5432/veriledger_test
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          # The uv that wrote uv.lock; Python comes from .python-version
          version: "0.11.25"
          enable-cache: true

      - name: Install exactly uv.lock
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check backend

      - name: Ruff format
        run: uv run ruff format --check backend

      - name: Mypy strict
        run: uv run mypy backend/app backend/tests

      - name: Layer contracts (AR-03, AR-04, AR-05)
        run: uv run lint-imports

      - name: Import the app with runtime dependencies only
        # asyncpg is a runtime dependency and aiosqlite is not, so this needs a PostgreSQL URL; nothing connects to it
        env:
          DATABASE_URL: postgresql+asyncpg://unused:unused@localhost/unused
        run: make check-imports

      - name: Tests, integration tests on PostgreSQL
        # -rs prints why a test was skipped, so a missing database shows instead of passing quietly
        run: uv run pytest backend/tests -rs

  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # /health is a readiness check since VLA-26, so the healthcheck needs a database that answers
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: veriledger
          POSTGRES_PASSWORD: veriledger
          POSTGRES_DB: veriledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veriledger -d veriledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build the image
        run: docker build -t veriledger-api:ci .

      - name: The app imports inside it, with runtime dependencies only
        run: docker run --rm -e DATABASE_URL=postgresql+asyncpg://unused:unused@localhost/unused veriledger-api:ci python -c "import backend.app.main"

      - name: It runs as a non-root user
        run: test "$(docker run --rm veriledger-api:ci id -u)" = 10001

      - name: Its healthcheck turns healthy once the database answers
        # The host network reaches the job's PostgreSQL service on 127.0.0.1
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL=postgresql+asyncpg://veriledger:veriledger@127.0.0.1:5432/veriledger veriledger-api:ci
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' api)
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker logs api
          echo "the healthcheck says $status"
          exit 1

      - name: Its log lines are JSON, with a request id
        run: |
          curl -fsS -H 'X-Request-ID: ci-check-1' http://127.0.0.1:8000/health
          docker logs api 2>&1 | grep '"request_id": "ci-check-1"' | python3 -c 'import json, sys; [json.loads(line) for line in sys.stdin]'

  compose:
    name: compose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - name: docker compose up from a clean clone answers /health
        run: |
          docker compose up -d --build backend
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health
          # The API started because migrate succeeded, so the tables are there
          test "$(docker compose ps -a migrate --format '{{.ExitCode}}')" = 0
          curl -fsS http://127.0.0.1:8000/blocks
          # migrate also seeded the development admin (VLA-24)
          curl -fsS -d 'username=admin@veriledger.com&password=adminpassword123' http://127.0.0.1:8000/auth/login

      - name: docker-compose.ghcr.yml runs the image this job built, without building (VLA-38)
        run: |
          docker compose down -v
          export API_IMAGE=veriledger-api API_IMAGE_TAG=dev
          docker compose -f docker-compose.ghcr.yml up -d backend
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS -d 'username=admin@veriledger.com&password=adminpassword123' http://127.0.0.1:8000/auth/login
          # The API runs from the image, not from the checkout
          test -z "$(docker compose -f docker-compose.ghcr.yml config | grep -E '^ +build:|type: bind')"

      - name: The production file is complete
        run: |
          cp deploy/.env.example deploy/.env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/' deploy/.env
          docker compose -f deploy/docker-compose.prod.yml config -q

      - name: Logs
        if: failure()
        run: |
          docker compose logs
          docker compose -f docker-compose.ghcr.yml logs

