name: CI

on:
  # Every PR, whatever its base, so a stacked PR is checked too
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or PR cancels the run it makes obsolete
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: veriledger
          POSTGRES_PASSWORD: veriledger
          POSTGRES_DB: veriledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veriledger -d veriledger_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The settings need a URL at import; tests that touch a database use TEST_DATABASE_URL
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      TEST_DATABASE_URL: postgresql+asyncpg://veriledger:veriledger@localhost:5432/veriledger_test
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          # The uv that wrote uv.lock; Python comes from .python-version
          version: "0.11.25"
          enable-cache: true

      - name: Install exactly uv.lock
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check backend

      - name: Ruff format
        run: uv run ruff format --check backend

      - name: Mypy strict
        run: uv run mypy backend/app backend/tests

      - name: Layer contracts (AR-03, AR-04, AR-05)
        run: uv run lint-imports

      - name: Import the app with runtime dependencies only
        # asyncpg is a runtime dependency and aiosqlite is not, so this needs a PostgreSQL URL; nothing connects to it
        env:
          DATABASE_URL: postgresql+asyncpg://unused:unused@localhost/unused
        run: make check-imports

      - name: Tests, integration tests on PostgreSQL
        # -rs prints why a test was skipped, so a missing database shows instead of passing quietly
        run: uv run pytest backend/tests -rs

  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # /health is a readiness check since VLA-26, so the healthcheck needs a database that answers
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: veriledger
          POSTGRES_PASSWORD: veriledger
          POSTGRES_DB: veriledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veriledger -d veriledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build the image
        run: docker build -t veriledger-api:ci .

      - name: The app imports inside it, with runtime dependencies only
        run: docker run --rm -e DATABASE_URL=postgresql+asyncpg://unused:unused@localhost/unused veriledger-api:ci python -c "import backend.app.main"

      - name: It runs as a non-root user
        run: test "$(docker run --rm veriledger-api:ci id -u)" = 10001

      - name: Its healthcheck turns healthy once the database answers
        # The host network reaches the job's PostgreSQL service on 127.0.0.1
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL=postgresql+asyncpg://veriledger:veriledger@127.0.0.1:5432/veriledger veriledger-api:ci
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' api)
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker logs api
          echo "the healthcheck says $status"
          exit 1

      - name: Its log lines are JSON, with a request id
        run: |
          curl -fsS -H 'X-Request-ID: ci-check-1' http://127.0.0.1:8000/health
          docker logs api 2>&1 | grep '"request_id": "ci-check-1"' | python3 -c 'import json, sys; [json.loads(line) for line in sys.stdin]'

  compose:
    name: compose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - name: docker compose up from a clean clone answers /health
        run: |
          docker compose up -d --build backend
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health
          # The API started because migrate succeeded, so the tables are there
          test "$(docker compose ps -a migrate --format '{{.ExitCode}}')" = 0
          curl -fsS http://127.0.0.1:8000/blocks
          # migrate also seeded the development admin (VLA-24)
          curl -fsS -d 'username=admin@veriledger.com&password=adminpassword123' http://127.0.0.1:8000/auth/login

      - name: docker-compose.ghcr.yml runs the image this job built, without building (VLA-38)
        run: |
          docker compose down -v
          export API_IMAGE=veriledger-api API_IMAGE_TAG=dev
          docker compose -f docker-compose.ghcr.yml up -d backend
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS -d 'username=admin@veriledger.com&password=adminpassword123' http://127.0.0.1:8000/auth/login
          # The API runs from the image, not from the checkout
          test -z "$(docker compose -f docker-compose.ghcr.yml config | grep -E '^ +build:|type: bind')"

      - name: The production file is complete
        run: |
          cp deploy/.env.example deploy/.env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/; s/^DOMAIN=$/DOMAIN=localhost/' deploy/.env
          docker compose -f deploy/docker-compose.prod.yml config -q

      - name: Logs
        if: failure()
        run: |
          docker compose logs
          docker compose -f docker-compose.ghcr.yml logs

  rehearsal:
    name: rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The webapp build the rehearsal runs: its image tag and its smoke test come from the same commit
      WEBAPP_COMMIT: 6d5a2f3d8c301a9376374194e72ee85e9cbbb295
    steps:
      - uses: actions/checkout@v7.0.1

      - name: The API image this commit would publish
        run: docker build -t veriledger-api:rehearsal .

      - name: Write deploy/.env as docs/runbooks/deploy.md does
        run: |
          cp deploy/.env.example deploy/.env
          sed -i             -e "s/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=$(openssl rand -hex 24)/"             -e "s/^SECRET_KEY=$/SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')/"             -e "s/^ADMIN_EMAIL=$/ADMIN_EMAIL=operator@example.com/"             -e "s/^ADMIN_PASSWORD=$/ADMIN_PASSWORD=$(openssl rand -hex 16)/"             -e "s/^DOMAIN=$/DOMAIN=localhost/"             -e "s/^WEBAPP_IMAGE_TAG=main$/WEBAPP_IMAGE_TAG=sha-${WEBAPP_COMMIT:0:7}/"             deploy/.env

      - name: Start it as the runbook does
        run: API_IMAGE=veriledger-api API_IMAGE_TAG=rehearsal docker compose -f deploy/docker-compose.prod.yml up -d

      - name: Trust Caddy's local CA, as a browser on this machine would
        run: |
          for i in $(seq 1 60); do
            docker compose -f deploy/docker-compose.prod.yml exec -T caddy test -f /data/caddy/pki/authorities/local/root.crt && break
            sleep 2
          done
          docker compose -f deploy/docker-compose.prod.yml cp caddy:/data/caddy/pki/authorities/local/root.crt caddy-root.crt

      - name: deploy/verify.sh passes over verified HTTPS
        run: |
          set -a; . deploy/.env; set +a
          CURL_CA_BUNDLE="$PWD/caddy-root.crt" sh deploy/verify.sh https://localhost

      - name: A backup brings back what it saved, on this throwaway stack (VLA-28)
        run: |
          set -a; . deploy/.env; set +a
          export CURL_CA_BUNDLE="$PWD/caddy-root.crt"
          field() { python3 -c "import json, sys; print(json.load(sys.stdin)['$1'])"; }
          signed_in=$(curl -fsS --data-urlencode "username=$ADMIN_EMAIL" --data-urlencode "password=$ADMIN_PASSWORD" https://localhost/api/auth/login)
          token=$(echo "$signed_in" | field access_token)
          miner=$(python3 -c 'print("a" * 64)')
          mined=$(curl -fsS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d "{\"miner_address\": \"$miner\"}" https://localhost/api/blocks/mine)
          block=$(echo "$mined" | field block_hash)
          sh deploy/backup.sh backups/rehearsal.dump
          # The data is lost: every table and row goes
          wipe='DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
          docker compose -f deploy/docker-compose.prod.yml exec -T postgres sh -c "psql -v ON_ERROR_STOP=1 -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -c '$wipe'"
          sh deploy/restore.sh backups/rehearsal.dump
          sh deploy/verify.sh https://localhost
          curl -fsS "https://localhost/api/blocks/$block" | grep -q "$block"

      - name: The webapp passes its own smoke test behind Caddy
        run: |
          curl -fsSL -o webapp-smoke-test.sh "https://raw.githubusercontent.com/Alesso2805/veriledger-webapp/$WEBAPP_COMMIT/docker/smoke-test.sh"
          CURL_CA_BUNDLE="$PWD/caddy-root.crt" sh webapp-smoke-test.sh https://localhost

      - name: Logs
        if: failure()
        run: docker compose -f deploy/docker-compose.prod.yml logs
