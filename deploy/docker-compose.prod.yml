# Production: Caddy on ports 80 and 443 in front of the webapp and the API, on one hostname
# (ADR-0005). The published images, no bind mounts, no published database or API port, secrets from deploy/.env.
# cp deploy/.env.example deploy/.env, fill it in, then: docker compose -f deploy/docker-compose.prod.yml up -d

x-app: &app
  image: ${API_IMAGE:-ghcr.io/alesso2805/veriledger-api}:${API_IMAGE_TAG:-main}
  restart: unless-stopped
  env_file: .env
  environment:
    # Built from the database's own settings, so the password is written once
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
    # Caddy strips /api before the API sees the path; /api/docs needs to know it was there
    API_ROOT_PATH: /api
    # Only Caddy reaches the API, so its X-Forwarded-For is trusted: the demo limits then see the visitor's address
    FORWARDED_ALLOW_IPS: "*"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app
    restart: "no"
    # Migrates, then creates the admin of deploy/.env once; production refuses the development password
    command: ["sh", "-c", "alembic -c backend/alembic.ini upgrade head && python -m backend.app.cli.seed"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully

  webapp:
    image: ghcr.io/alesso2805/veriledger-webapp:${WEBAPP_IMAGE_TAG:-main}
    restart: unless-stopped
    environment:
      # One origin: the browser reaches the API through the same Caddy, so CSP_CONNECT_SRC stays unset
      API_BASE_URL: /api

  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and their keys, kept across restarts so Let's Encrypt is not asked again
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      webapp:
        condition: service_started

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
