version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    environment:
      - POSTGRES_USER=veriledger
      - POSTGRES_PASSWORD=veriledger_pass
      - POSTGRES_DB=veriledger
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgresql+asyncpg://veriledger:veriledger_pass@postgres:5432/veriledger
      - APP_ENV=development
      - APP_DEBUG=true
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "uv run uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload"

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=veriledger
      - POSTGRES_PASSWORD=veriledger_pass
      - POSTGRES_DB=veriledger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veriledger"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
